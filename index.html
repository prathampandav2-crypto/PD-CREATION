<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creation Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="glow glow-one"></div><div class="glow glow-two"></div>
      <img class="background-logo" src="logo.svg" alt="" aria-hidden="true" />
      <section class="login-wrap" aria-labelledby="page-title">
        <p class="eyebrow">COMPONENT <span>01</span></p>
        <h1 id="page-title">Creation<br /><em>Login</em></h1>
        <form id="login-form" class="login-card" novalidate>
          <h2>Sign in</h2>
          <p class="subhead">Enter your details to access your workspace.</p>
          <label for="email">Email</label>
          <div class="field"><input id="email" name="email" type="email" placeholder="you@studio.com" autocomplete="email" /><span class="status">✓</span></div>
          <div class="label-row"><label for="password">Password</label><a href="#reset">Forgot?</a></div>
          <div class="field"><input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" /><button type="button" class="eye" aria-label="Show password">⌁</button></div>
          <button class="login-button" type="submit"><span>Log in</span><b>→</b></button>
          <p class="terms">By continuing, you agree to our<br /><a href="#terms">Terms</a> and <a href="#privacy">Privacy Policy</a>.</p>
          <p class="signup">New to Creation? <a href="#signup">Create an account</a></p>
          <p class="success" role="status">Welcome back — opening your workspace.</p>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
